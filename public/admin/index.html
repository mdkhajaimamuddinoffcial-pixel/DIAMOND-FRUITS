<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIAMOND FRUITS Admin</title>
<style>body{font-family:system-ui;margin:0;background:#f4faf6;color:#173a28}.bar{background:#07572d;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.wrap{max-width:1200px;margin:25px auto;padding:0 18px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{padding:10px 15px;border:0;border-radius:8px;background:#fff}.tab.active{background:#087f3f;color:#fff}.panel,.stat{background:#fff;border-radius:14px;padding:18px;box-shadow:0 5px 20px #07572d12;margin-bottom:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5eee8;text-align:left;white-space:nowrap}input,select{padding:9px;border:1px solid #d9e7de;border-radius:8px}.save{background:#087f3f;color:#fff;border:0;border-radius:8px;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:25px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<header class="bar"><div><b>DIAMOND FRUITS</b><br><small>OWNER ADMIN • Rates & Orders</small></div><div>🔒 Owner Only</div></header><main class="wrap"><div class="tabs"><button class="tab active" onclick="show('dashboard',this)">Dashboard</button><button class="tab" onclick="show('products',this)">Products & Rates</button><button class="tab" onclick="show('orders',this)">Orders</button></div><section id="dashboard"><div class="grid" id="stats"></div></section><section id="products" style="display:none"><div class="panel"><h2>Products & Rates</h2><p>Only the authenticated owner/admin can change rates, stock and availability.</p><div id="ptable"></div></div></section><section id="orders" style="display:none"><div class="panel"><h2>Customer Orders</h2><div id="otable"></div></div></section></main>
<script>const API=window.__HATCHABLE__?.api||'/api';let products=[],orders=[];function show(id,b){['dashboard','products','orders'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(id==='products')loadProducts();if(id==='orders')loadOrders();if(id==='dashboard')loadAll()}async function loadProducts(){let r=await fetch(API+'/admin/products');if(!r.ok){document.getElementById('products').innerHTML='<div class="panel"><h2>Owner access required</h2><p>Sign in as the project owner/admin.</p></div>';return}products=await r.json();document.getElementById('ptable').innerHTML='<table><tr><th>Fruit</th><th>Rate</th><th>Unit</th><th>Stock</th><th>Available</th><th>Save</th></tr>'+products.map(p=>`<tr><td>${p.name}</td><td><input id="p-${p.id}" type="number" value="${p.price}" min="0"></td><td>${p.unit}</td><td><input id="s-${p.id}" type="number" value="${p.stock}" min="0"></td><td><input id="a-${p.id}" type="checkbox" ${p.availability?'checked':''}></td><td><button class="save" onclick="saveProduct('${p.id}')">Update</button></td></tr>`).join('')+'</table>'}async function saveProduct(id){let p=products.find(x=>x.id===id);let body={name:p.name,description:p.description,category:p.category,price:Number(document.getElementById('p-'+id).value),unit:p.unit,image_url:p.image_url,stock:Number(document.getElementById('s-'+id).value),availability:document.getElementById('a-'+id).checked,discount:Number(p.discount||0)};let r=await fetch(API+'/admin/products?id='+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert(r.ok?'Updated successfully':'Update failed');if(r.ok)loadProducts()}async function loadOrders(){let r=await fetch(API+'/admin/orders');if(!r.ok){document.getElementById('otable').innerHTML='<p>Owner access required.</p>';return}orders=await r.json();document.getElementById('otable').innerHTML='<table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Update</th></tr>'+orders.map(o=>`<tr><td>${o.order_number}<br><small>${new Date(o.created_at).toLocaleString()}</small></td><td>${o.customer_name}<br>${o.phone}<br><small>${o.address}, ${o.city}, ${o.state} ${o.pincode}</small></td><td>${o.items.map(i=>i.product_name+' × '+i.quantity+' '+i.unit).join('<br>')}</td><td>₹${Number(o.total).toFixed(0)}</td><td>${o.payment_method}<br>${o.payment_status}</td><td>${o.status}</td><td><select onchange="status('${o.id}',this.value)"><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="preparing">Preparing</option><option value="out_for_delivery">Out for Delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></td></tr>`).join('')+'</table>'}async function status(id,status){let r=await fetch(API+'/admin/orders',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});if(r.ok)loadOrders();else alert('Could not update order')}async function loadAll(){await Promise.all([loadProducts(),loadOrders()]);document.getElementById('stats').innerHTML=`<div class="stat"><small>Total Products</small><br><b>${products.length}</b></div><div class="stat"><small>Total Orders</small><br><b>${orders.length}</b></div><div class="stat"><small>Pending</small><br><b>${orders.filter(o=>o.status==='pending').length}</b></div><div class="stat"><small>Sales</small><br><b>₹${orders.reduce((s,o)=>s+Number(o.total),0).toFixed(0)}</b></div>`}loadAll();</script></body></html>
